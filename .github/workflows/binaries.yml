name: binaries

# The prebuilt binaries scripts/install.sh downloads, and their SHA256SUMS,
# uploaded to a release. The release workflow calls this for every release it
# makes; run it by hand to give an existing release its binaries. A pull
# request that changes how they are built builds them without uploading.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: The release to build, e.g. v0.2.1
        type: string
        required: true
  pull_request:
    paths:
      - .github/workflows/binaries.yml
      - scripts/install.sh

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # A static binary runs on any Linux. rusqlite's bundled SQLite is C, so
      # it needs musl's compiler as well.
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/fleet fleet-${{ matrix.target }}
      # Only the binary this runner can run: the other macOS one is checked
      # by install.sh on the machine that downloads it.
      - if: matrix.target != 'x86_64-apple-darwin'
        run: ./fleet-${{ matrix.target }} --version
      - if: env.TAG != ''
        run: gh release upload "$TAG" fleet-${{ matrix.target }} --clobber

  checksums:
    needs: build
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -eu
          mkdir dist && cd dist
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'fleet-*'
          sha256sum fleet-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" SHA256SUMS --clobber

  # `release` is what `fleet update` installs and `herdr plugin update`
  # follows from then on, so it moves only once the binaries and their sums
  # are up: an update in between would build from source. A run by hand for
  # an older release leaves it where it is.
  release-branch:
    needs: checksums
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -eu
          newest=$(git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY.git" 'refs/tags/v*' |
            sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$TAG" != "$newest" ]; then
            echo "$TAG is not the newest release ($newest); release stays where it is"
            exit 0
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" -q .sha)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/release" -f sha="$sha" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/release -f sha="$sha" >/dev/null
          fi
          echo "release is at $TAG ($sha)"
