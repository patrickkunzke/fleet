# What the release job writes into CHANGELOG.md and the GitHub Release, from
# the conventional commits since the last tag. https://git-cliff.org

[changelog]
# CHANGELOG.md keeps its own header; the release job adds each section below it.
header = ""
body = """
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/patrickkunzke/fleet/releases/tag/{{ version }}) — {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^revert", group = "<!-- 3 -->Reverts" },
  # docs, ci, chore, refactor, test, …: nothing a user of fleet would notice.
  { message = ".*", skip = true },
]
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
