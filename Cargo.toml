[package]
name = "fleet"
version = "0.1.0"
edition = "2024"
description = "A terminal orchestrator for Claude Code sessions across several repos"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
libc = "0.2.189"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"

# Startup time is the whole argument for building this in Rust, so the release
# profile is tuned for a small binary that is ready immediately.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
