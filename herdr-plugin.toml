# fleet inside herdr: a chief of staff that plans and delegates, one Claude
# Code agent per repository in a tab of its own, and a view of the crew — the
# board, the graph, who is waiting on you.
#
# herdr draws every agent's terminal. fleet opens the tabs, briefs what runs
# in them, carries messages between them, and brings a crew back after a
# restart. Nothing runs until you ask for it: an action, or a workspace opened
# at a directory you listed in ~/.claude-fleet/auto-open.

id = "fleet"
name = "fleet"
version = "0.6.0"
description = "A chief of staff that delegates to Claude Code agents across repositories, with a task board and a live graph of the crew."
# 0.9.1 is the first whose `agent focus` moves the screen to the agent, which
# ↵ in the view relies on.
min_herdr_version = "0.9.1"
platforms = ["macos", "linux"]

# The release's prebuilt binary for this machine, or a build from source
# when there is none (scripts/install.sh).
[[build]]
command = ["sh", "scripts/install.sh"]

[[actions]]
id = "open"
title = "fleet: open"
description = "Focus this workspace's fleet view, or open one at the workspace's directory. The first time, it starts the chief beside it; after a restart, it offers the crew to bring back."
contexts = ["workspace", "pane"]
command = ["target/release/fleet", "herdr", "open"]

[[actions]]
id = "new"
title = "fleet: new workspace in fleet mode"
description = "A new workspace at the focused pane's directory, with the fleet view in it and the chief beside it."
contexts = ["workspace", "pane"]
command = ["target/release/fleet", "herdr", "new"]

[[actions]]
id = "doctor"
title = "fleet: check the setup"
description = "What fleet needs from herdr and Claude Code, and what to change if something is off. Prints to the plugin log."
contexts = ["workspace", "pane"]
command = ["target/release/fleet", "herdr", "doctor"]

# Fleet mode for a new workspace at a directory listed in
# ~/.claude-fleet/auto-open. Any other workspace is left alone.
[[events]]
on = "workspace.created"
command = ["target/release/fleet", "herdr", "event"]
